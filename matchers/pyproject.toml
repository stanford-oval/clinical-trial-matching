[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matchers"
version = "0.1.0"
description = "Reference implementations of the nine systems compared in 'Cross-Validated Symbolic and Natural-Language Reasoning for Auditable Clinical-Trial Prescreen' (EMNLP submission)."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Anonymous EMNLP submission"}]
keywords = ["clinical-trial", "smt", "neuro-symbolic", "eligibility", "auditability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/anonymous-emnlp/smt-trial-matching"

[project.scripts]
matchers-inspect = "matchers.inspect_one:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["matchers*"]
